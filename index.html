<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">
<title>Mon Budget</title>
<style>
:root{
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#8a8f8d;
  --bg:#f4f6f5; --card:#fff; --ink:#15201d; --mute:#65736f; --line:#e3e8e6;
  --pri:#0f766e; --pri2:#ccebe7; --ok:#15803d; --warn:#b45309; --bad:#b91c1c;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#2f9e2f;--c7:#9085e9;--c8:#7d8784;--bg:#0d1312; --card:#151d1b; --ink:#e7efec; --mute:#93a39e; --line:#24302d; --pri:#2dd4bf; --pri2:#123a35; --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;max-width:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior-x:none;touch-action:pan-y}
body{position:relative}
header{max-width:100%;position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:20px;margin:0}
header small{color:var(--mute)}
main{padding:0 14px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;width:100%;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:8px 2px 10px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--pri);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid2>*{min-width:0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat .l{font-size:12px;color:var(--mute)}
.stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)} .neg{color:var(--bad)} .wrn{color:var(--warn)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .s{font-size:12px;color:var(--mute)}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
@media (prefers-color-scheme:dark){.btn{color:#04201c}}
.btn.ghost{background:var(--pri2);color:var(--pri)}
.btn.sm{padding:6px 10px;font-size:13px}
.icon{background:none;border:0;color:var(--mute);padding:6px;font-size:18px;line-height:1}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;color:#fff;font-size:14px}
.chk.on{background:var(--ok);border-color:var(--ok)}
.done .t{text-decoration:line-through;color:var(--mute)}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--pri2);color:var(--pri);white-space:nowrap}
.pill.h{background:#fde2e2;color:#b91c1c} .pill.m{background:#fdf0d5;color:#92400e}
@media (prefers-color-scheme:dark){.pill.h{background:#3b1414;color:#fca5a5}.pill.m{background:#3a2a0c;color:#fcd34d}}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;gap:3px;margin:8px 0}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;color:var(--mute);font-size:13px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600}
.empty{color:var(--mute);text-align:center;padding:18px 6px;font-size:14px}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;border:0;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
@media (prefers-color-scheme:dark){.fab{color:#04201c}}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{overflow-x:hidden;background:var(--card);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 12px}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
input,select,textarea{width:100%;min-width:0;max-width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
input[type=date],input[type=month],input[type=datetime-local]{-webkit-appearance:none;appearance:none;min-height:44px;display:block}
input::-webkit-date-and-time-value{text-align:left}
.actions{display:flex;gap:8px;margin-top:16px}
.actions .btn{flex:1}
.note{font-size:12px;color:var(--mute)}
.tip{border-left:4px solid var(--pri);padding:8px 10px;background:var(--pri2);border-radius:8px;margin:8px 0;font-size:14px}
.tip.w{border-color:var(--warn);background:rgba(245,158,11,.12)}
.tip.b{border-color:var(--bad);background:rgba(239,68,68,.12)}
.pie-wrap{display:flex;gap:14px;align-items:center}
.pie-wrap svg{flex:none;width:150px;height:150px}
.pie-wrap svg path{cursor:pointer;transition:opacity .15s}
.pie-legend{flex:1;min-width:0}
.pie-legend .li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:8px;font-size:13px;cursor:pointer}
.pie-legend .li.on{background:var(--pri2)}
.pie-legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.pie-legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pie-legend .pc{color:var(--mute);font-variant-numeric:tabular-nums;width:36px;text-align:right}
.pie-legend .am{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:560px){.pie-wrap{flex-direction:column;align-items:stretch;gap:8px}.pie-wrap svg{align-self:center;width:170px;height:170px}}
.segbar{display:flex;gap:2px;height:8px;border-radius:99px;overflow:hidden;margin-top:6px;background:var(--line)}
.segbar i{display:block;height:100%}
.hist-row{cursor:pointer}
.hist-row.on{background:var(--pri2);margin:0 -14px;padding-left:14px;padding-right:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <div><h1 id="title">Mon Budget</h1><small id="subtitle"></small></div>
  <button class="icon" id="btnSettings" aria-label="Réglages">⚙️</button>
</header>
<main id="view"></main>
<button class="fab" id="fab" aria-label="Ajouter">+</button>
<nav id="nav"></nav>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================== Veri ================== */
const KEY = 'cuzdan.v1';
const DEF = {
  todos: [], expenses: [], installments: [], recurring: [],
  settings: { income: 0 }
};
let S;
try { S = Object.assign(structuredClone(DEF), JSON.parse(localStorage.getItem(KEY) || '{}')); }
catch (e) { S = structuredClone(DEF); }
S.settings = Object.assign({}, DEF.settings, S.settings);
S.incomeHist = S.incomeHist || {};
function migrate(){
  const cur = ym(new Date());
  S.recurring.forEach(r=>{ if(!r.start){ const p=(r.paid||[]).slice().sort(); r.start = p[0] && p[0]<cur ? p[0] : cur; } r.paidAmt = r.paidAmt||{}; });
  if(S.settings.income && !Object.keys(S.incomeHist).length) S.incomeHist[cur] = +S.settings.income;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast('Échec de l\'enregistrement : stockage désactivé'); } syncReminders(); }

/* ================== Hatırlatıcılar ==================
   Android'de: telefonun alarm/bildirim sistemine kurulur (uygulama kapalıyken de çalışır).
   Tarayıcıda: sayfa açıkken bildirim + ekranda uyarı. */
let lastReminderJson = null;
const REPEATS = [['','Pas de répétition'],['15m','Toutes les 15 minutes'],['30m','Toutes les 30 minutes'],['1h','Toutes les heures'],['3h','Toutes les 3 heures'],['1d','Tous les jours'],['1w','Toutes les semaines'],['1M','Tous les mois']];
const REPEAT_LABEL = {'15m':'toutes les 15 min','30m':'toutes les 30 min','1h':'toutes les heures','3h':'toutes les 3 h','1d':'tous les jours','1w':'chaque semaine','1M':'chaque mois'};
const FIXED_MS = {'15m':9e5,'30m':18e5,'1h':36e5,'3h':108e5};
/* k. tekrarın zamanı (k=0: ilk hatırlatma) */
function occAt(base, rep, k){
  if(FIXED_MS[rep]) return base + k*FIXED_MS[rep];
  const d = new Date(base);
  if(rep==='1d') d.setDate(d.getDate()+k);
  else if(rep==='1w') d.setDate(d.getDate()+7*k);
  else if(rep==='1M'){ const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+k); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); }
  return +d;
}
function approxMs(rep){ return FIXED_MS[rep] || {'1d':864e5,'1w':6048e5,'1M':2592e6}[rep]; }
/* now'dan sonraki ilk hatırlatma (yoksa null) */
function nextOcc(t, now=Date.now()){
  const base = new Date(t.remind).getTime(); if(!isFinite(base)) return null;
  if(!t.repeat || !REPEAT_LABEL[t.repeat]) return base>now ? base : null;
  if(base>now) return base;
  let k = Math.max(0, Math.floor((now-base)/approxMs(t.repeat)) - 1);
  while(occAt(base,t.repeat,k)<=now) k++;
  return occAt(base,t.repeat,k);
}
/* now'a kadar gerçekleşmiş son hatırlatma (yoksa null) */
function lastOcc(t, now=Date.now()){
  const base = new Date(t.remind).getTime(); if(!isFinite(base) || base>now) return null;
  if(!t.repeat || !REPEAT_LABEL[t.repeat]) return base;
  let k = Math.max(0, Math.floor((now-base)/approxMs(t.repeat)) + 1);
  while(k>0 && occAt(base,t.repeat,k)>now) k--;
  return occAt(base,t.repeat,k);
}
function reminderList(){
  const now = Date.now();
  return S.todos.filter(t=>!t.done && t.remind).map(t=>({id:t.id, title:t.text, note:t.note||'', time:new Date(t.remind).getTime(), repeat:(REPEAT_LABEL[t.repeat]?t.repeat:'')}))
    .filter(r=>isFinite(r.time) && (r.repeat || r.time>now));
}
function syncReminders(){
  if(!(window.Android && Android.setReminders)) return;
  const j = JSON.stringify(reminderList());
  if(j===lastReminderJson) return;
  lastReminderJson = j;
  try { Android.setReminders(j); } catch(e){}
}
function browserReminderTick(){
  if(window.Android) return;
  const now = Date.now(); let changed=false;
  S.todos.forEach(t=>{
    if(t.done || !t.remind) return;
    if(t.notified===t.remind && t.lastFire==null) t.lastFire = new Date(t.remind).getTime();
    const tm = lastOcc(t, now);
    if(tm==null || (t.lastFire||0) >= tm) return;
    t.lastFire = tm; changed=true;
    if(now-tm < 6*36e5){
      toast('🔔 '+t.text);
      try { if('Notification' in window && Notification.permission==='granted'){ if(navigator.serviceWorker&&navigator.serviceWorker.ready) navigator.serviceWorker.ready.then(r=>r.showNotification('Rappel Mon Budget',{body:t.text,icon:'icon-192.png'})).catch(()=>{}); else new Notification('Rappel Mon Budget',{body:t.text}); } } catch(e){}
    }
  });
  if(changed){ save(); if(tab==='todo'||tab==='ozet') render(); }
}
const fmtDT = d => d.toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

const CATS = ['Courses','Restaurants','Transport','Factures','Loyer','Santé','Vêtements','Loisirs','Éducation','Autre'];
const tl = n => (isFinite(n)?n:0).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const tl2 = n => (isFinite(n)?n:0).toLocaleString('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:2});
const num = (n,d=2) => (isFinite(n)?n:0).toLocaleString('fr-FR',{maximumFractionDigits:d});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);

/* ================== Tarih yardımcıları ================== */
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const ym = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const thisYM = () => ym(new Date());
const monthDiff = (a,b) => { const [ay,am]=a.split('-').map(Number), [by,bm]=b.split('-').map(Number); return (by-ay)*12+(bm-am); };
const addMonths = (ymStr,k) => { const [y,m]=ymStr.split('-').map(Number); return ym(new Date(y,m-1+k,1)); };
const dueDate = (ymStr,day) => { const [y,m]=ymStr.split('-').map(Number); const last=new Date(y,m,0).getDate(); return new Date(y,m-1,Math.min(day,last)); };
const fmtDate = d => d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const monthName = ymStr => { const [y,m]=ymStr.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}); };
migrate();

/* Taksit: ay k (0..n-1) aktif mi? */
function instIndex(it, ymStr){ const k = monthDiff(it.start, ymStr); return (k>=0 && k<it.count) ? k : -1; }
const instMonthly = it => it.total/it.count;
const instPaidCount = it => (it.paid||[]).length;
const instRemaining = it => instMonthly(it) * Math.max(0, it.count - instPaidCount(it));

/* Düzenli ödeme o ay geçerli mi (eklendiği aydan, silindiği aya kadar) */
function recActive(r, ymStr){ return (!r.start || r.start<=ymStr) && (!r.end || ymStr<=r.end); }
const liveRecurring = () => S.recurring.filter(r=>!r.deleted);
function incomeFor(ymStr){ const ks=Object.keys(S.incomeHist).filter(k=>k<=ymStr).sort(); return ks.length? +S.incomeHist[ks[ks.length-1]] : 0; }
/* Bu ayın sabit yükleri */
function monthObligations(ymStr){
  const items = [];
  S.installments.forEach(it=>{ const k=instIndex(it,ymStr); if(k>=0) items.push({kind:'inst', ref:it, name:it.name, amount:instMonthly(it), day:it.day, sub:`Échéance ${k+1}/${it.count}`, paid:(it.paid||[]).includes(ymStr)}); });
  S.recurring.forEach(r=>{ if(!recActive(r,ymStr)) return; const paid=(r.paid||[]).includes(ymStr);
    items.push({kind:'rec', ref:r, name:r.name, amount: paid && r.paidAmt && r.paidAmt[ymStr]!=null ? +r.paidAmt[ymStr] : +r.amount, day:r.day, sub:r.category||'Paiement régulier', paid}); });
  return items.sort((a,b)=>a.day-b.day);
}
function monthSpent(ymStr){ return S.expenses.filter(e=>e.date.slice(0,7)===ymStr).reduce((s,e)=>s+ +e.amount,0); }
function avgVariable(){
  // son 3 ayın değişken harcama ortalaması (veri olan aylar)
  const cur = thisYM(); const vals=[];
  for(let k=0;k<3;k++){ const m=addMonths(cur,-k); const v=monthSpent(m); if(v>0||k===0) vals.push(v); }
  return vals.length? vals.reduce((a,b)=>a+b,0)/vals.length : 0;
}

/* ================== UI çatı ================== */
const TABS = [
  {id:'ozet', name:'Résumé', icon:'<path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/>'},
  {id:'todo', name:'À faire', icon:'<path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/>'},
  {id:'harcama', name:'Dépenses', icon:'<path d="M21 7H3V5h18zm0 4H3v8h18zm-4 6h-3v-2h3z"/>'},
  {id:'odeme', name:'Paiements', icon:'<path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14z"/>'},
  {id:'rapor', name:'Rapports', icon:'<path d="M11 2v20c-5.07-.5-9-4.79-9-10s3.93-9.5 9-10zm2.03 0v8.99H22c-.47-4.74-4.24-8.52-8.97-8.99zm0 11.01V22c4.74-.47 8.5-4.25 8.97-8.99z"/>'}
];
let tab = (location.hash||'').slice(1); if(!TABS.find(t=>t.id===tab)) tab='ozet';
let sub = { odeme:'taksit', harcama:'liste', todo:'acik' };

function renderNav(){
  $('#nav').innerHTML = TABS.map(t=>`<button data-tab="${t.id}" class="${t.id===tab?'on':''}"><svg viewBox="0 0 24 24" fill="currentColor">${t.icon}</svg>${t.name}</button>`).join('');
}
$('#nav').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; tab=b.dataset.tab; try{history.replaceState(null,'','#'+tab);}catch(_){} render(); window.scrollTo(0,0); });

function render(){
  renderNav();
  const t = TABS.find(x=>x.id===tab);
  $('#title').textContent = t.id==='ozet' ? 'Mon Budget' : t.name;
  $('#subtitle').textContent = monthName(thisYM());
  $('#fab').style.display = (tab==='ozet'||tab==='rapor') ? 'none' : '';
  ({ozet:vOzet, todo:vTodo, harcama:vHarcama, odeme:vOdeme, rapor:vRapor})[tab]();
}

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

/* Alt sayfa (form) */
function openSheet(html, onSubmit){
  $('#sheet').innerHTML = html; $('#sheetBg').classList.add('open');
  const f = $('#sheet form');
  if(f) f.addEventListener('submit',e=>{ e.preventDefault(); const data=Object.fromEntries(new FormData(f)); if(onSubmit(data)!==false){ closeSheet(); save(); render(); } });
  $('#sheet').querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);
  const first=$('#sheet input:not([type=hidden]),#sheet select'); if(first) first.focus();
}
function closeSheet(){ $('#sheetBg').classList.remove('open'); }
$('#sheetBg').addEventListener('click',e=>{ if(e.target.id==='sheetBg') closeSheet(); });

function confirmSheet(msg, fn){
  openSheet(`<h3>${esc(msg)}</h3><div class="actions"><button class="btn ghost" data-close>Annuler</button><button class="btn" id="cOk" style="background:var(--bad);color:#fff">Supprimer</button></div>`);
  $('#cOk').onclick=()=>{ fn(); closeSheet(); save(); render(); };
}

/* ================== ÖZET ================== */
function vOzet(){
  const m = thisYM(), inc = +S.settings.income||0;
  const obl = monthObligations(m);
  const oblTotal = obl.reduce((s,o)=>s+o.amount,0);
  const spent = monthSpent(m);
  const left = inc - oblTotal - spent;
  const openTodos = S.todos.filter(t=>!t.done);
  const now = today(), in7 = new Date(+now+7*864e5);
  const upcoming = [];
  [m, addMonths(m,1)].forEach(mm=>monthObligations(mm).forEach(o=>{ const d=dueDate(mm,o.day); if(!o.paid && d>=now && d<=in7) upcoming.push({...o,date:d,ym:mm}); }));
  // gecikmiş
  const overdue = obl.filter(o=>!o.paid && dueDate(m,o.day)<now);
  // kategori dağılımı
  const byCat = {}; S.expenses.filter(e=>e.date.slice(0,7)===m).forEach(e=>byCat[e.category]=(byCat[e.category]||0)+ +e.amount);
  const cats = Object.entries(byCat).sort((a,b)=>b[1]-a[1]); const maxC = cats[0]?.[1]||1;

  $('#view').innerHTML = `

function oblRow(o, ymStr, date){
  const d = date || dueDate(ymStr,o.day);

function togglePay(spec){
  const [kind,id,m] = spec.split(':');
  const list = kind==='inst'?S.installments:S.recurring; const it=list.find(x=>x.id===id); if(!it) return;
  it.paid = it.paid||[]; const i=it.paid.indexOf(m); if(i>=0) it.paid.splice(i,1); else it.paid.push(m);
  if(kind==='rec'){ it.paidAmt = it.paidAmt||{}; if(i>=0) delete it.paidAmt[m]; else it.paidAmt[m] = +it.amount; }
  save(); render(); toast(i>=0?'Paiement annulé':'Marqué comme payé');
}

  $('#view').querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>togglePay(b.dataset.pay));

let repMonth = thisYM();
const repActive = {};
const COLORS = ['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)'];
const OTHER = 'var(--c8)';

function monthReport(m){
  const obl = monthObligations(m);
  const inst = obl.filter(o=>o.kind==='inst'), rec = obl.filter(o=>o.kind==='rec');
  const exps = S.expenses.filter(e=>e.date.slice(0,7)===m);
  const byCat = {}; exps.forEach(e=>byCat[e.category]=(byCat[e.category]||0)+ +e.amount);
  const spent = exps.reduce((s,e)=>s+ +e.amount,0);
  const instT = inst.reduce((s,o)=>s+o.amount,0), recT = rec.reduce((s,o)=>s+o.amount,0);
  const unpaid = obl.filter(o=>!o.paid).length;
  return {m, inc:incomeFor(m), spent, instT, recT, total:spent+instT+recT, byCat, obl, unpaid, count:exps.length};
}
function historyMonths(){
  const cur=thisYM(); const starts=[cur];
  S.expenses.forEach(e=>starts.push(e.date.slice(0,7)));
  S.installments.forEach(i=>starts.push(i.start));
  S.recurring.forEach(r=>r.start&&starts.push(r.start));
  Object.keys(S.incomeHist).forEach(k=>starts.push(k));
  let first = starts.filter(x=>x<=cur).sort()[0];
  if(monthDiff(first,cur)>35) first = addMonths(cur,-35);
  const out=[]; for(let m=cur; m>=first; m=addMonths(m,-1)) out.push(m);
  return out;
}
/* En büyük 6 dilim + "Diğer": 8. renk asla üretilmez, kuyruk toplanır */
function toSlices(pairs){
  const arr = pairs.filter(p=>p[1]>0).sort((a,b)=>b[1]-a[1]);
  const top = arr.length>7 ? arr.slice(0,6) : arr;
  const rest = arr.length>7 ? arr.slice(6).reduce((s,p)=>s+p[1],0) : 0;
  const sl = top.map((p,i)=>({name:p[0], value:p[1], color:COLORS[i]}));
  if(rest>0) sl.push({name:'Autres', value:rest, color:OTHER});
  return sl;
}
function arcPath(cx,cy,r0,r1,a0,a1){
  const p=(r,a)=>[cx+r*Math.sin(a), cy-r*Math.cos(a)];
  const large = a1-a0>Math.PI?1:0;
  const [x0,y0]=p(r1,a0),[x1,y1]=p(r1,a1),[x2,y2]=p(r0,a1),[x3,y3]=p(r0,a0);
  return `M${x0},${y0}A${r1},${r1} 0 ${large} 1 ${x1},${y1}L${x2},${y2}A${r0},${r0} 0 ${large} 0 ${x3},${y3}Z`;
}
function pieChart(id, title, slices){
  const total = slices.reduce((s,x)=>s+x.value,0);
  if(!total) return `<div class="card"><h2>${title}</h2><div class="empty">Aucune donnée ce mois-ci</div></div>`;
  const act = repActive[id];
  const cx=75, cy=75, r1=72, r0=44;
  let a=0, paths='';
  slices.forEach((s,i)=>{
    const frac=s.value/total; const a1=a+frac*2*Math.PI;
    const dim = act!=null && act!==i ? ' opacity=".3"' : '';
    const label = `${esc(s.name)}: ${tl(s.value)} (%${num(frac*100,0)})`;
    if(frac>=0.9999) paths += `<path d="${arcPath(cx,cy,r0,r1,0,Math.PI*1.9999)}" fill="${s.color}" data-pie="${id}:${i}"${dim}><title>${label}</title></path>`;
    else paths += `<path d="${arcPath(cx,cy,r0,r1,a,a1)}" fill="${s.color}" stroke="var(--card)" stroke-width="2" stroke-linejoin="round" data-pie="${id}:${i}"${dim}><title>${label}</title></path>`;
    a=a1;
  });
  const cs = act!=null ? slices[act] : null;
  const center = cs
    ? `<text x="75" y="70" text-anchor="middle" font-size="11" fill="var(--mute)">${esc(cs.name.length>14?cs.name.slice(0,13)+'…':cs.name)}</text><text x="75" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${tl(cs.value)}</text>`
    : `<text x="75" y="70" text-anchor="middle" font-size="11" fill="var(--mute)">Total</text><text x="75" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">${tl(total)}</text>`;
  return `<div class="card"><h2>${title}</h2><div class="pie-wrap">
    <svg viewBox="0 0 150 150" role="img" aria-label="${esc(title)}">${paths}${center}</svg>
    <div class="pie-legend">${slices.map((s,i)=>`<div class="li ${act===i?'on':''}" data-pie="${id}:${i}"><span class="sw" style="background:${s.color}"></span><span class="nm">${esc(s.name)}</span><span class="pc">%${num(s.value/total*100,0)}</span><span class="am">${tl(s.value)}</span></div>`).join('')}</div>
  </div></div>`;
}
function vRapor(){
  const R0 = monthReport(repMonth);
  const left = R0.inc - R0.total;
  const compSlices = [['Dépenses',R0.spent,'var(--c1)'],['Échelonnés',R0.instT,'var(--c2)'],['Paiements réguliers',R0.recT,'var(--c3)']]
    .filter(x=>x[1]>0).map(x=>({name:x[0],value:x[1],color:x[2]}));
  const catSlices = toSlices(Object.entries(R0.byCat));
  const payPairs = {}; R0.obl.forEach(o=>payPairs[o.name]=(payPairs[o.name]||0)+o.amount);
  const paySlices = toSlices(Object.entries(payPairs));
  const months = historyMonths();
  const reps = months.map(monthReport);
  const maxT = Math.max(1,...reps.map(r=>r.total));

  $('#view').innerHTML = `
    <div class="card" style="display:flex;align-items:center;justify-content:space-between">
      <button class="icon" id="rpm" aria-label="Mois précédent">‹</button>
      <div style="text-align:center"><div style="font-weight:600">${monthName(repMonth)}</div><div class="note">${repMonth===thisYM()?'Ce mois-ci':'Mois passé'}</div></div>
      <button class="icon" id="rnm" aria-label="Mois suivant" ${repMonth>=thisYM()?'disabled style="opacity:.3"':''}>›</button></div>
    <div class="grid2">
      <div class="stat" id="incStat" style="cursor:pointer"><div class="l">Revenu ✎</div><div class="v">${R0.inc?tl(R0.inc):'<span class="note">Non saisi</span>'}</div></div>
      <div class="stat"><div class="l">Reste</div><div class="v ${left<0?'neg':'pos'}">${R0.inc?tl(left):'–'}</div></div>
      <div class="stat"><div class="l">Total des dépenses</div><div class="v">${tl(R0.total)}</div></div>
      <div class="stat"><div class="l">Paiements non réglés</div><div class="v ${R0.unpaid?'wrn':''}">${R0.unpaid}</div></div>
    </div>
    ${pieChart('comp','Répartition des dépenses', compSlices)}
    ${pieChart('cat','Dépenses · par catégorie', catSlices)}
    ${pieChart('pay','Paiements · échelonnés et réguliers', paySlices)}
    <div class="card"><h2>Historique mensuel</h2>
      <div class="note" style="display:flex;gap:12px;margin-bottom:4px;flex-wrap:wrap">
        <span><span class="sw" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c1)"></span> Dépenses</span>
        <span><span class="sw" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c2)"></span> Échelonnés</span>
        <span><span class="sw" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c3)"></span> Réguliers</span></div>
      ${reps.map(r=>{ const lf=r.inc-r.total; const w=r.total/maxT*100;
        return `<div class="row hist-row ${r.m===repMonth?'on':''}" data-hm="${r.m}" style="flex-wrap:wrap">
          <div class="grow"><div class="t">${monthName(r.m)}</div>
            <div class="s">Dépenses ${tl(r.spent)} · Échelonnés ${tl(r.instT)} · Réguliers ${tl(r.recT)}</div>
            <div class="segbar" style="width:${Math.max(w,2)}%">${[[r.spent,'var(--c1)'],[r.instT,'var(--c2)'],[r.recT,'var(--c3)']].filter(x=>x[0]>0).map(x=>`<i style="flex:${x[0]};background:${x[1]}" title="${tl(x[0])}"></i>`).join('')}</div></div>
          <div style="text-align:right"><div class="amt">${tl(r.total)}</div><div class="s ${lf<0?'neg':'pos'}">${r.inc?(lf<0?'':'+')+tl(lf):''}</div></div></div>`; }).join('')}
    </div>`;
  $('#incStat').onclick=()=>openSheet(`<form><h3>Revenu de ${monthName(repMonth)}</h3>
    <label>Revenu net (€)</label><input name="inc" type="number" inputmode="decimal" min="0" value="${R0.inc||''}">
    <p class="note">Ce montant s'applique à partir de ce mois-ci, jusqu'au prochain changement de revenu.</p>
    <div class="actions"><button type="button" class="btn ghost" data-close>Annuler</button><button class="btn">Enregistrer</button></div></form>`,
    d=>{ S.incomeHist[repMonth]=+d.inc||0; if(repMonth===thisYM()) S.settings.income=+d.inc||0; });
  $('#rpm').onclick=()=>{ repMonth=addMonths(repMonth,-1); for(const k in repActive) delete repActive[k]; render(); };
  $('#rnm').onclick=()=>{ if(repMonth<thisYM()){ repMonth=addMonths(repMonth,1); for(const k in repActive) delete repActive[k]; render(); } };
  $('#view').querySelectorAll('[data-pie]').forEach(el=>el.onclick=()=>{ const [id,i]=el.dataset.pie.split(':'); repActive[id] = repActive[id]===+i ? null : +i; const y=window.scrollY; render(); window.scrollTo(0,y); });
  $('#view').querySelectorAll('[data-hm]').forEach(el=>el.onclick=()=>{ repMonth=el.dataset.hm; for(const k in repActive) delete repActive[k]; render(); window.scrollTo({top:0,behavior:'smooth'}); });
}

/* ================== AYARLAR ================== */
$('#btnSettings').onclick=()=>{
  const st=S.settings;
  openSheet(`<form><h3>Réglages</h3>
    <label>Revenu net mensuel (€)</label><input name="income" type="number" inputmode="decimal" min="0" value="${esc(st.income||'')}">
    <p class="note">Le revenu sert à calculer le « reste » dans Résumé et Rapports. Si tu le modifies, les revenus des mois passés sont conservés.</p>
    <div class="actions"><button type="button" class="btn ghost" data-close>Annuler</button><button class="btn">Enregistrer</button></div>
    <h3 style="margin-top:24px">Sauvegarde</h3>
    <p class="note">Les données restent uniquement sur ce téléphone. Fais une sauvegarde avant de supprimer l'application ou de changer de téléphone.</p>
    <div class="actions"><button type="button" class="btn ghost" id="exp">Télécharger la sauvegarde</button><button type="button" class="btn ghost" id="cpy">Copier</button></div>
    <label>Restaurer une sauvegarde (.json)</label><input type="file" id="imp" accept="application/json,.json">
  </form>`, d=>{ st.income=+d.income||0; S.incomeHist[thisYM()]=st.income; });
  $('#exp').onclick=()=>{ if(window.Android&&Android.shareBackup){ Android.shareBackup(JSON.stringify(S,null,1)); return; } const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='mon-budget-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); };
  $('#cpy').onclick=async()=>{ try{ await navigator.clipboard.writeText(JSON.stringify(S)); toast('Sauvegarde copiée dans le presse-papiers'); }catch(e){ toast('Copie impossible'); } };
  $('#imp').onchange=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const j=JSON.parse(await f.text()); if(!j.settings) throw 0; S=Object.assign(structuredClone(DEF),j); save(); closeSheet(); render(); toast('Sauvegarde restaurée'); }catch(_){ toast('Fichier de sauvegarde invalide'); } };
};

  if(tab==='todo') todoForm();
  else if(tab==='harcama') expForm();
  else if(tab==='odeme') sub.odeme==='taksit'?instForm():recForm();
};
